name: Build & Deploy Documentation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    name: Build, check, deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Locale parity
        run: npm run check:parity

      - name: Verify all internal links resolve
        run: npm run check:links

      # peaceiris/actions-gh-pages@v4 is a mutable tag. Accepted for parity
      # with mhm-rentiva-docs; if it is ever pinned to a SHA, pin it in both
      # repositories in the same change so they do not diverge.
      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
