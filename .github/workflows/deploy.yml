name: Build & Deploy Documentation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    name: Build, check, deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm ci

      - name: Read the plugin anchor
        id: ref
        run: |
          # 🔴 An empty output here would make actions/checkout fall back to the
          #    plugin repo's DEFAULT branch, and every gate below would measure
          #    develop while claiming the pinned tag. Fail loudly instead.
          REF="$(tr -d '[:space:]' < plugin-ref.txt 2>/dev/null || true)"
          [ -n "$REF" ] || { echo "::error::plugin-ref.txt is missing or empty — refusing to fall back to the default branch"; exit 1; }
          echo "v=$REF" >> "$GITHUB_OUTPUT"

      - name: Check out the plugin tree at that anchor
        uses: actions/checkout@v5
        with:
          repository: MaxHandMade/mhm-currency-switcher
          ref: ${{ steps.ref.outputs.v }}
          path: .plugin-src

      - name: Placement tables match the plugin
        run: |
          node scripts/generate-placement-page.js
          git diff --exit-code -- docs/yerlestirme.md i18n/tr/docusaurus-plugin-content-docs/current/yerlestirme.md \
            || { echo "::error::Placement tables are stale. Run 'node scripts/generate-placement-page.js' and commit."; exit 1; }

      - name: Docs claims are backed by the plugin source
        run: bash scripts/check-plugin-claims.sh

      - name: Every endpoint the plugin calls is documented
        run: bash scripts/check-external-services.sh

      - name: Build website
        run: npm run build

      - name: Locale parity
        run: npm run check:parity

      - name: Verify all internal links resolve
        run: npm run check:links

      # Internal links only prove the site is consistent with itself. This
      # step requests every external link we authored and fails both on a
      # plain error status and on a 200 that arrived at a different path —
      # the shape a soft 404 takes. Eleven pages pointed at an unpublished
      # WordPress.org plugin page for weeks and check:links could not see it,
      # because it never leaves the build directory.
      - name: Verify all external links resolve
        run: npm run check:external

      # peaceiris/actions-gh-pages@v4 is a mutable tag. Accepted for parity
      # with mhm-rentiva-docs; if it is ever pinned to a SHA, pin it in both
      # repositories in the same change so they do not diverge.
      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
